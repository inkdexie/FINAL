<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园助手 - 自习室</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark sticky-top site-nav">
    <div class="container">
      <a class="navbar-brand" href="index.html">校园助手</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="展开导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link active" href="study.html">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="stats.html">统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <h2 class="mb-4">自习室</h2>

    <div id="status" class="alert alert-warning">加载中...</div>

    <div id="filter-panel" class="d-none">
      <div class="filter-bar">
        <span class="filter-label">搜索</span>
        <input type="text" class="form-control form-control-sm" id="search-input" placeholder="输入名称关键字" style="max-width: 240px;">
        <button class="btn btn-sm btn-success ms-auto" data-bs-toggle="collapse" data-bs-target="#add-form">+ 添加自习室</button>
      </div>

      <div class="collapse card mb-3" id="add-form">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-3">
              <input type="text" class="form-control form-control-sm" id="new-name" placeholder="名称（如 401自习室）">
            </div>
            <div class="col-md-2">
              <select class="form-select form-select-sm" id="new-floor">
                <option value="1楼">1楼</option>
                <option value="2楼">2楼</option>
                <option value="3楼">3楼</option>
              </select>
            </div>
            <div class="col-md-2">
              <select class="form-select form-select-sm" id="new-type">
                <option value="自习室">自习室</option>
                <option value="研讨间">研讨间</option>
              </select>
            </div>
            <div class="col-md-2">
              <input type="number" class="form-control form-control-sm" id="new-seats" placeholder="总座位数" min="1">
            </div>
            <div class="col-md-2">
              <input type="number" class="form-control form-control-sm" id="new-used" placeholder="已用座位数" min="0">
            </div>
            <div class="col-md-1 d-flex align-items-center">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="new-open" checked>
                <label class="form-check-label small" for="new-open">开放</label>
              </div>
            </div>
          </div>
          <div class="mt-2 d-flex align-items-center gap-2">
            <button class="btn btn-primary btn-sm" id="add-btn">确认添加</button>
            <span id="form-msg" class="text-danger small"></span>
          </div>
        </div>
      </div>

      <div class="filter-bar">
        <span class="filter-label">楼层</span>
        <div class="btn-group btn-group-sm" id="floor-filters" role="group" aria-label="按楼层筛选">
          <button type="button" class="btn btn-primary" data-floor="全部">全部</button>
          <button type="button" class="btn btn-outline-primary" data-floor="1楼">1楼</button>
          <button type="button" class="btn btn-outline-primary" data-floor="2楼">2楼</button>
          <button type="button" class="btn btn-outline-primary" data-floor="3楼">3楼</button>
        </div>
      </div>
      <div class="filter-bar">
        <span class="filter-label">状态</span>
        <div class="btn-group btn-group-sm" id="open-filters" role="group" aria-label="按开放状态筛选">
          <button type="button" class="btn btn-primary" data-open="全部">全部</button>
          <button type="button" class="btn btn-outline-primary" data-open="open">开放中</button>
          <button type="button" class="btn btn-outline-primary" data-open="closed">已关闭</button>
        </div>
      </div>
      <div class="filter-bar">
        <span class="filter-label">类型</span>
        <select class="form-select form-select-sm" id="type-filter" aria-label="按类型筛选" style="max-width: 160px;">
          <option value="全部">全部</option>
          <option value="自习室">自习室</option>
          <option value="研讨间">研讨间</option>
        </select>
      </div>
      <ul class="list-group" id="room-list"></ul>
    </div>
  </main>

  <footer>
    <p>校园助手 · 自习室信息与数据展示中心</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/study.js"></script>
</body>
</html>

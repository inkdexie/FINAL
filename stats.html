<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园助手 - 统计</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark sticky-top site-nav">
    <div class="container">
      <a class="navbar-brand" href="index.html">校园助手</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="展开导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="study.html">自习室</a></li>
          <li class="nav-item"><a class="nav-link active" href="stats.html">统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <h2 class="mb-4">数据统计</h2>

    <div id="status" class="alert alert-warning">加载中...</div>

    <div id="charts" class="d-none">
      <div class="card mb-4">
        <div class="card-body">
          <h3 class="h5" id="bar-title"></h3>
          <div class="chart-box"><canvas id="bar-chart" role="img" aria-label="各自习室本周使用量柱状图"></canvas></div>
          <p class="text-muted small mt-3 mb-0" id="bar-source"></p>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <h3 class="h5" id="line-title"></h3>
          <div class="chart-box" id="line-chart" role="img" aria-label="本周每日入馆人次趋势折线图"></div>
          <p class="text-muted small mt-3 mb-0" id="line-source"></p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>校园助手 · 自习室信息与数据展示中心</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
